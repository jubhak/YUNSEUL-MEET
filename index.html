<!DOCTYPE html>
<html lang="ko" class="landing-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUNSEUL MEET - 실시간 화상 미팅 솔루션</title>
  <link rel="stylesheet" href="css/style.css?v=20261018a">
  <link rel="stylesheet" href="css/av-extras.css?v=20260930k">
  <style>
    /* 관리자 미팅 생성 잠금 안내 모달 */
    .meeting-lock-gate {
      position: fixed;
      inset: 0;
      z-index: 9600;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 40%, rgba(10, 16, 28, .72) 0%, rgba(2, 4, 9, .9) 80%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity .26s ease;
    }
    .meeting-lock-gate.hidden { display: none !important; }
    .meeting-lock-gate.is-in { opacity: 1; }

    .meeting-lock-card {
      width: min(94vw, 430px);
      padding: 28px 26px 22px;
      border-radius: 20px;
      text-align: center;
      color: #e6edf7;
      background: linear-gradient(160deg, #16203a 0%, #0b1220 100%);
      border: 1px solid rgba(99, 179, 237, .32);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .66), inset 0 1px 0 rgba(255, 255, 255, .06);
      transform: translateY(14px) scale(.97);
      transition: transform .34s cubic-bezier(.22, 1, .36, 1);
    }
    .meeting-lock-gate.is-in .meeting-lock-card { transform: translateY(0) scale(1); }

    .meeting-lock-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border-radius: 16px;
      background: rgba(245, 158, 11, .12);
      border: 1px solid rgba(245, 158, 11, .38);
      box-shadow: 0 0 0 6px rgba(245, 158, 11, .06);
    }
    .meeting-lock-card h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: #f8fafc;
    }
    .meeting-lock-msg {
      margin: 0;
      font-size: .86rem;
      line-height: 1.6;
      color: #cbd5e1;
      word-break: keep-all;
    }
    .meeting-lock-detail {
      margin: 10px 0 0;
      padding: 9px 12px;
      font-size: .78rem;
      line-height: 1.5;
      color: #9fb0c8;
      border-radius: 10px;
      background: rgba(56, 189, 248, .07);
      border: 1px solid rgba(56, 189, 248, .18);
      word-break: keep-all;
    }
    .meeting-lock-detail.hidden { display: none !important; }
    .meeting-lock-ok {
      margin-top: 18px;
      width: 100%;
      height: 44px;
      font-size: .9rem;
      font-weight: 700;
      border-radius: 10px;
    }
  </style>
</head>
<body class="landing-page">
  <div class="landing-container">
    <header class="landing-header">
      <h1>YUNSEUL MEET</h1>
      <p class="subtitle">화상 미팅 솔루션</p>
    </header>

    <main class="landing-main">
      <section id="card-join" class="card">
        <h2>참가자 — 방 참가</h2>
        <p>호스트가 알려준 참여 코드를 입력하고 참가하세요.</p>
        <div class="form-group join-code-group">
          <label for="join-code">참여 코드</label>
          <input type="text" id="join-code" placeholder="예: 1234" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="viewer-name">아이디</label>
          <input type="text" id="viewer-name" placeholder="참가자" maxlength="20" autocomplete="nickname">
        </div>
        <button id="btn-join-room" class="btn btn-secondary btn-lg">방 참가하기</button>
        <p id="join-error" class="error-text hidden"></p>
        <p class="landing-switch">
          <a href="#create" id="link-show-host">새로운 방 만들기</a>
        </p>
      </section>

      <section id="card-host" class="card hidden">
        <h2>호스트 — 방 만들기</h2>
        <p>아이디를 입력하고 방을 만든 뒤, 참가자에게 참여 코드를 공유하세요.</p>
        <div class="form-group">
          <label for="host-name">호스트 아이디</label>
          <input type="text" id="host-name" placeholder="예: 김선생" maxlength="20" autocomplete="nickname">
        </div>
        <fieldset class="form-group room-mode-group">
          <legend>미팅 방식</legend>
          <label class="room-mode-option">
            <input type="radio" name="interaction-mode" value="bidirectional" checked>
            <span class="room-mode-text">
              <span class="room-mode-title">양방향</span>
              <span class="room-mode-desc">화상 미팅 — 마이크·화면 공유(기존 방식)</span>
            </span>
          </label>
          <label class="room-mode-option">
            <input type="radio" name="interaction-mode" value="unidirectional">
            <span class="room-mode-text">
              <span class="room-mode-title">단방향</span>
              <span class="room-mode-desc">대규모 시청(약 1000명) — 호스트 송출만, 채팅은 동일</span>
            </span>
          </label>
        </fieldset>
        <div id="mic-required-wrap" class="form-group mic-required-group">
          <label class="checkbox-option">
            <input type="checkbox" id="require-mic" name="require-mic">
            <span class="checkbox-text">
              <span class="checkbox-title">마이크 사용 필수</span>
              <span class="checkbox-desc">마이크가 연결되고 활성화된 참가자만 입장 가능</span>
            </span>
          </label>
        </div>
        <div id="all-voice-wrap" class="form-group mic-required-group" style="display: none;">
          <label class="checkbox-option">
            <input type="checkbox" id="allow-all-voice" name="allow-all-voice">
            <span class="checkbox-text">
              <span class="checkbox-title">모든 참가자 목소리 미팅 허용</span>
              <span class="checkbox-desc">영상은 호스트만 송출 · 참가자는 마이크 확인 후 입장(마이크는 꺼진 상태로 시작). 체크 해제 시 호스트가 지정한 1명만 발언</span>
            </span>
          </label>
        </div>
        <div id="camera-allowed-wrap" class="form-group camera-allowed-group">
          <label class="checkbox-option">
            <input type="checkbox" id="allow-client-cam" name="allow-client-cam" checked>
            <span class="checkbox-text">
              <span class="checkbox-title">참가자 카메라 허용</span>
              <span class="checkbox-desc">체크 해제 시 참가자는 카메라를 켤 수 없으며 목소리(마이크)만 송출 가능</span>
            </span>
          </label>
          <div id="deepfake-allowed-subwrap" style="margin-left: 1.5rem; margin-top: 0.5rem;">
            <label class="checkbox-option">
              <input type="checkbox" id="allow-client-deepfake" name="allow-client-deepfake" checked>
              <span class="checkbox-text">
                <span class="checkbox-title">참가자 딥페이크(AI 얼굴) 허용</span>
                <span class="checkbox-desc">체크 해제 시 참가자는 딥페이크 기능을 사용할 수 없고 호스트만 사용 가능</span>
              </span>
            </label>
          </div>
        </div>
        <div class="form-group host-code-group">
          <label for="host-room-code">참여 코드</label>
          <div class="host-code-row">
            <input type="text" id="host-room-code" placeholder="1234" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-describedby="host-code-hint">
            <button type="button" id="btn-reroll-code" class="btn btn-sm btn-ghost" title="다른 코드 만들기">↻</button>
          </div>
          <p id="host-code-hint" class="host-code-hint">참가자에게 알려줄 4자리 코드입니다. 직접 바꿀 수 있어요.</p>
        </div>
        <hr class="host-divider">
        <button id="btn-create-room" class="btn btn-primary btn-lg">새 방 만들기</button>
        <p id="host-error" class="error-text hidden"></p>
        <p class="landing-switch host-landing-switch">
          <a href="#join" id="link-show-join">방 참가하기로 돌아가기</a>
        </p>
      </section>
    </main>

  </div>

  <script type="module" src="js/landing.js?v=20261107lock"></script>
</body>
</html>
