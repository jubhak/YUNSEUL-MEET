; ========================================================
; YUNSEUL-MEET 실물 웹캠 뷰티 필터 설정 (myface.ini)
; 메모장으로 수치를 수정한 후 저장하고, 브라우저에서 F5(새로고침)를 누르면 즉시 반영됩니다.
; ========================================================

[beauty]
; 1. 스킨 스무딩 강도 (0.00 ~ 1.00)
;    - 0.00 : 필터 끔 (원본 그대로)
;    - 0.68 : 스트리머 방송용 표준 뽀샤시 (기본값)
;    - 0.90 ~ 1.00 : 모공과 잔주름이 완전히 사라지는 강력한 뽀샤시 (최대 1.00)
smooth_intensity = 0.63

; 2. 엣지(윤곽선) 보존 민감도 (1.0 ~ 100.0)
;    - 낮을수록 (예: 8.0 ~ 12.0) : 안경테, 눈동자, 눈썹, 모자 로고를 칼같이 선명하게 유지
;    - 높을수록 (예: 25.0 ~ 50.0) : 팔자 주름 등 굵은 굴곡까지 더 과감하게 뭉개서 펴줌
edge_threshold = 17.0

; 3. 블러 퍼짐 반경 (1 ~ 30)
;    - 1 ~ 3   : 미세 모공/잡티 위주 완화 (기본 3)
;    - 5 ~ 8   : 팔자 주름 등 굵은 음영 골짜기를 지우는 데 매우 효과적
;    - 10 ~ 20 : 극도로 뽀샤시한 소프트 포커스 (원하는 만큼 크게 입력 가능)
blur_radius = 20

; 4. 피부 톤업 밝기 (0.50 ~ 2.50)
;    - 1.00 : 원본 밝기 유지
;    - 1.05 : 화사하고 자연스러운 피부 톤업 (+5%)
;    - 1.12 ~ 1.25 : 방송용 링라이트 조명을 비춘 듯 밝고 환한 피부
brightness_lift = 1.7

; 5. 입체감 대비 균형 (0.50 ~ 2.50)
;    - 1.00 : 원본 대비
;    - 1.04 ~ 1.15 : 얼굴이 허옇게 뜨지 않도록 눈매와 얼굴선의 또렷한 입체감 강화
contrast_balance = 1.30
