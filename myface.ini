; ========================================================
; YUNSEUL-MEET 실물 웹캠 및 딥페이크 설정 (myface.ini)
; 호스트 컨트롤 바 또는 메모장으로 수정한 후 저장 시 실시간 반영됩니다.
; ========================================================

[beauty]
; 1. 스킨 스무딩 강도 (0.00 ~ 1.00)
;    - 0.00 : 필터 끔 (원본 그대로)
;    - 0.20 ~ 0.35 : 자연스러운 피부결 정돈 및 미세 모공 완화
;    - 0.60 ~ 0.75 : 방송용 표준 뽀샤시 스킨
;    - 0.90 ~ 1.00 : 잡티와 잔주름이 완전히 사라지는 강력한 뽀샤시
smooth_intensity = 0.20

; 2. 엣지(윤곽선) 보존 민감도 (1.0 ~ 100.0)
;    - 낮을수록 (예: 8.0 ~ 15.0) : 안경테, 눈동자, 눈썹, 모자 챙 등 이목구비와 윤곽선을 칼같이 선명하게 유지
;    - 높을수록 (예: 50.0 ~ 100.0) : 팔자 주름, 미간 주름 등 굵은 굴곡 음영까지 더 과감하게 뭉개서 펴줌
edge_threshold = 58.5

; 3. 블러 퍼짐 반경 (1 ~ 30)
;    - 1 ~ 3 : 미세 요철 및 모공 위주 정돈 (선명한 디테일 유지)
;    - 5 ~ 10 : 팔자 주름과 깊은 굴곡 음영을 지우는 데 효과적
;    - 15 ~ 30 : 극도로 뽀샤시한 소프트 포커스 뷰티 효과
blur_radius = 12

; 4. 피부 톤업 밝기 (0.50 ~ 2.50)
;    - 1.00 : 원본 밝기 유지
;    - 1.10 ~ 1.30 : 화사하고 자연스러운 피부 톤업 (+10% ~ +30%)
;    - 1.50 ~ 2.50 : 방송용 링라이트 조명을 직접 비춘 듯 밝고 환한 피부 연출
brightness_lift = 2.50

; 5. 입체감 대비 균형 (0.50 ~ 2.50)
;    - 1.00 : 원본 대비 유지
;    - 1.10 ~ 1.30 : 얼굴이 허얗게 뜨지 않도록 눈매와 턱선의 또렷한 입체감 강화
;    - 1.40 ~ 1.80 : 깊이감 있는 고대비 방송 화면 연출
contrast_balance = 1.46

[Deepface]
; 1. AI 합성 혼합 비율 (0.00 ~ 1.00)
;    - 0.00 : 100% 내 본래 얼굴 (스왑 끔)
;    - 0.85 ~ 0.95 : 본래 내 얼굴 골격/표정이 자연스럽게 혼합
;    - 1.00 : 100% 완전한 AI 얼굴로 대체 (기본값)
swap_blend_ratio = 1.00

; 2. 디테일 선명도 (0.00 ~ 2.00)
;    - 0.00 : 원본 스왑 그대로
;    - 0.40 ~ 0.80 : 눈동자, 속눈썹, 치아 등 이목구비 고해상도 언샵 마스크 선명화
;    - 1.00 ~ 2.00 : 칼같이 또렷한 극초고화질 디테일 강조
detail_sharpen = 1.85

; 3. 경계면 페더링 반경 (1 ~ 30)
;    - 1 ~ 5 : 칼같은 경계 (밀착)
;    - 12 ~ 18 : 헤어라인, 모자, 턱선과의 부드럽고 자연스러운 그라데이션 (기본값 15)
;    - 20 ~ 30 : 넓은 반경의 자연스러운 경계선 소프트 블렌딩
border_feather = 30

; 4. 피부톤/조명 일치 (0.00 ~ 1.00)
;    - 0.00 : 사진 고유의 색감 유지
;    - 0.70 ~ 0.90 : 내 방 웹캠의 조명/피부색을 AI 얼굴에 자연스럽게 동기화 (기본값 0.80)
;    - 1.00 : 원본 조명 및 색감 100% 일치
tone_matching = 1.00

; 5. 얼굴 인식 민감도 (0.30 ~ 0.85)
;    - 0.30 ~ 0.50 : 고개 회전이나 모자 착용 시 더 공격적으로 얼굴 추적
;    - 0.60 : 표준 검출 신뢰도 임계값 (기본값)
;    - 0.70 ~ 0.85 : 오인식을 방지하는 엄격한 얼굴 검출
detection_threshold = 0.69
