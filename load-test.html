<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPT 로딩 테스트</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "tslib": "https://cdn.jsdelivr.net/npm/tslib@2.7.0/tslib.es6.mjs",
      "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm",
      "lodash": "https://cdn.jsdelivr.net/npm/lodash-es@4.17.21/lodash.js",
      "uuid": "https://cdn.jsdelivr.net/npm/uuid@10.0.0/+esm",
      "echarts": "./js/echarts-stub.js",
      "pptx-preview": "https://esm.sh/pptx-preview@1.0.7"
    }
  }
  </script>
  <style>
    body { overflow: auto; padding: 1rem; }
    #log { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 13px;
      background: #111; color: #9f9; padding: 1rem; border-radius: 8px; max-height: 40vh; overflow: auto; }
    #stage { height: 50vh; background: #000; margin-top: 1rem; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <h1>PPT 로딩 시간 테스트</h1>
  <p>Desktop\PPT 에서 파일을 선택하세요. 2차 → 성공 후 3차 순으로 테스트.</p>
  <input type="file" id="file" accept=".pptx">
  <pre id="log"></pre>
  <div id="stage"><div id="presentation-stage" class="presentation-stage" style="position:relative;inset:auto;width:100%;height:100%">
    <div id="slide-fit" class="slide-fit">
      <div id="slide-scaler" class="slide-scaler">
        <div id="slide-container" class="slide-container"></div>
      </div>
    </div>
  </div></div>

  <script type="module">
    import { PptEngine } from './js/ppt-engine.js';

    const logEl = document.getElementById('log');
    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      console.log(line);
    }

    document.getElementById('file').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      logEl.textContent = '';
      log(`파일: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`);
      const tAll = performance.now();
      try {
        const t0 = performance.now();
        const buf = await file.arrayBuffer();
        log(`arrayBuffer: ${(performance.now()-t0).toFixed(0)}ms`);

        const engine = new PptEngine(document.getElementById('slide-container'), {
          isHost: false,
          onProgress: (m) => log(m),
          onSlideCountReady: (c) => log(`slideCount=${c}`),
        });

        const t1 = performance.now();
        await engine.loadFromArrayBuffer(buf);
        log(`loadFromArrayBuffer TOTAL: ${(performance.now()-t1).toFixed(0)}ms`);
        engine.goToSlide(0);
        engine.resize();
        log(`전체 성공: ${(performance.now()-tAll).toFixed(0)}ms`);
      } catch (err) {
        log('실패: ' + err.message);
        console.error(err);
      }
    });
  </script>
</body>
</html>
